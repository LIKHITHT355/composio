<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Composio App Buildability - Blind Human Review & Gold Labelling</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --success: #10b981;
      --accent: #818cf8;
      --danger: #ef4444;
      --card-radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 80px;
    }
    header.sticky-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 16px 32px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    .header-left h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary);
    }
    .header-left p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .header-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn {
      background: var(--primary);
      color: #0f172a;
      font-weight: 600;
      font-size: 0.875rem;
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover { background: var(--primary-hover); color: white; }
    .btn-secondary {
      background: #334155;
      color: var(--text);
    }
    .btn-secondary:hover { background: #475569; }
    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: #334155;
      position: absolute;
      bottom: 0;
      left: 0;
    }
    .progress-bar {
      height: 100%;
      background: var(--success);
      width: 0%;
      transition: width 0.3s;
    }
    .container {
      max-width: 1100px;
      margin: 24px auto;
      padding: 0 16px;
    }
    .app-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--card-radius);
      padding: 24px;
      margin-bottom: 24px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .app-card:hover {
      border-color: #475569;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }
    .card-title {
      font-size: 1.25rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 9999px;
      font-weight: 600;
      background: #334155;
      color: var(--text-muted);
    }
    .badge-cat { background: rgba(56, 189, 248, 0.15); color: var(--primary); }
    .hint-link {
      font-size: 0.85rem;
      color: var(--accent);
      text-decoration: none;
      word-break: break-all;
    }
    .hint-link:hover { text-decoration: underline; }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }
    select, input[type="text"], textarea {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
    }
    select:focus, input[type="text"]:focus, textarea:focus {
      border-color: var(--primary);
    }
    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      background: #0f172a;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
    .checkbox-label {
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--text);
      cursor: pointer;
      text-transform: none;
      letter-spacing: normal;
    }
    .full-width { grid-column: 1 / -1; }
    .status-pill {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 4px;
    }
    .status-complete { background: rgba(16, 185, 129, 0.2); color: var(--success); }
    .status-pending { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
  </style>
</head>
<body>

  <header class="sticky-header">
    <div class="header-left">
      <h1>Composio Benchmark: Blind Ground Truth Review (30 Sampled Apps)</h1>
      <p>Human Gate #1: Label each app without viewing agent answers. Changes auto-save to localStorage.</p>
    </div>
    <div class="header-controls">
      <span id="counter" style="font-size: 0.9rem; font-weight: 600; color: var(--primary);">0 / 30 Completed</span>
      <button class="btn btn-secondary" onclick="exportCSV()">Export CSV</button>
      <button class="btn" onclick="exportJSON()">Export gold_labels.json</button>
    </div>
    <div class="progress-bar-container">
      <div id="progress" class="progress-bar"></div>
    </div>
  </header>

  <div class="container" id="cards-container">
    <!-- Populated by JS -->
  </div>

  <!-- Embedded Sample Dataset -->
  <script id="sample-data" type="application/json">
[
  {"id": 4, "app": "Attio", "category": "CRM and Sales", "hint": "attio.com"},
  {"id": 5, "app": "Twenty", "category": "CRM and Sales", "hint": "twenty.com (open-source CRM)"},
  {"id": 10, "app": "DealCloud", "category": "CRM and Sales", "hint": "api.docs.dealcloud.com"},
  {"id": 14, "app": "Front", "category": "Support and Helpdesk", "hint": "front.com"},
  {"id": 17, "app": "Plain", "category": "Support and Helpdesk", "hint": "plain.com"},
  {"id": 20, "app": "Gladly", "category": "Support and Helpdesk", "hint": "gladly.com"},
  {"id": 24, "app": "Lark (Larksuite)", "category": "Communications and Messaging", "hint": "open.larksuite.com"},
  {"id": 25, "app": "Pumble", "category": "Communications and Messaging", "hint": "pumble.com"},
  {"id": 28, "app": "WhatsApp Business", "category": "Communications and Messaging", "hint": "developers.facebook.com/docs/whatsapp"},
  {"id": 31, "app": "Google Ads", "category": "Marketing, Ads, Email and Social", "hint": "developers.google.com/google-ads"},
  {"id": 34, "app": "GoHighLevel", "category": "Marketing, Ads, Email and Social", "hint": "highlevel.stoplight.io"},
  {"id": 37, "app": "systeme.io", "category": "Marketing, Ads, Email and Social", "hint": "systeme.io (funnel builder)"},
  {"id": 44, "app": "Salesforce Commerce Cloud", "category": "Ecommerce", "hint": "developer.salesforce.com/docs/commerce"},
  {"id": 49, "app": "Amazon Selling Partner", "category": "Ecommerce", "hint": "developer-docs.amazon.com/sp-api"},
  {"id": 50, "app": "fanbasis", "category": "Ecommerce", "hint": "fanbasis.com"},
  {"id": 56, "app": "Firecrawl", "category": "Data, SEO and Scraping", "hint": "firecrawl.dev"},
  {"id": 58, "app": "Sherlock", "category": "Data, SEO and Scraping", "hint": "github.com/sherlock-project/sherlock"},
  {"id": 59, "app": "Waterfall.io", "category": "Data, SEO and Scraping", "hint": "waterfall.io (contact/company intel)"},
  {"id": 64, "app": "Cloudflare", "category": "Developer, Infra and Data platforms", "hint": "developers.cloudflare.com/api"},
  {"id": 68, "app": "MongoDB Atlas", "category": "Developer, Infra and Data platforms", "hint": "mongodb.com/docs/atlas/api"},
  {"id": 69, "app": "Datadog", "category": "Developer, Infra and Data platforms", "hint": "docs.datadoghq.com/api"},
  {"id": 71, "app": "Notion", "category": "Productivity and Project Management", "hint": "developers.notion.com"},
  {"id": 75, "app": "Asana", "category": "Productivity and Project Management", "hint": "developers.asana.com"},
  {"id": 76, "app": "Monday.com", "category": "Productivity and Project Management", "hint": "developer.monday.com"},
  {"id": 86, "app": "QuickBooks", "category": "Finance and Fintech", "hint": "developer.intuit.com"},
  {"id": 88, "app": "Brex", "category": "Finance and Fintech", "hint": "developer.brex.com"},
  {"id": 90, "app": "PitchBook", "category": "Finance and Fintech", "hint": "pitchbook.com (research API)"},
  {"id": 91, "app": "NotebookLM", "category": "AI, Research and Media-native", "hint": "cloud.google.com/gemini (Enterprise API)"},
  {"id": 98, "app": "Mermaid CLI", "category": "AI, Research and Media-native", "hint": "github.com/mermaid-js/mermaid-cli"},
  {"id": 100, "app": "Grain", "category": "AI, Research and Media-native", "hint": "grain.com (meeting notes)"}
]
  </script>

  <script>
    const STORAGE_KEY = "composio_gold_labels_v1";
    const sampleApps = JSON.parse(document.getElementById("sample-data").textContent);
    let labels = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");

    const AUTH_OPTIONS = ["oauth2", "api_key", "bearer_token", "basic", "jwt", "hmac_signing", "aws_sigv4", "none", "other", "unsure"];
    const CRED_OPTIONS = ["", "self_serve_free", "self_serve_trial", "paid_plan_required", "approval_required", "partner_or_sales_gated", "no_public_api", "not_applicable", "unsure"];
    const API_OPTIONS = ["", "true", "false", "unsure"];
    const MCP_OPTIONS = ["", "official", "community", "none", "unknown", "unsure"];
    const VERDICT_OPTIONS = ["", "ready_now", "ready_with_caveats", "needs_outreach", "blocked", "not_an_api_product", "unsure"];
    const BLOCKER_OPTIONS = ["", "none", "no_public_api", "paid_plan", "app_review_or_approval", "partner_program", "contact_sales", "complex_auth", "docs_unclear", "not_a_hosted_service", "other", "unsure"];

    function renderCards() {
      const container = document.getElementById("cards-container");
      container.innerHTML = "";

      sampleApps.forEach((item, index) => {
        const id = item.id;
        const saved = labels[id] || { auth_methods: [] };
        const isComplete = checkComplete(saved);

        const card = document.createElement("div");
        card.className = "app-card";
        card.id = `card-${id}`;

        const cleanHint = item.hint.split(" ")[0].trim();
        const hintUrl = cleanHint.startsWith("http") ? cleanHint : `https://${cleanHint}`;

        let authCheckboxes = AUTH_OPTIONS.map(opt => `
          <label class="checkbox-label">
            <input type="checkbox" onchange="updateAuth(${id}, '${opt}', this.checked)" ${(saved.auth_methods || []).includes(opt) ? "checked" : ""}>
            ${opt}
          </label>
        `).join("");

        card.innerHTML = `
          <div class="card-header">
            <div>
              <div class="card-title">
                <span>#${item.id} ${item.app}</span>
                <span class="badge badge-cat">${item.category}</span>
                <span class="status-pill ${isComplete ? 'status-complete' : 'status-pending'}" id="status-${id}">
                  ${isComplete ? 'Completed' : 'Pending'}
                </span>
              </div>
              <a href="${hintUrl}" target="_blank" rel="noopener" class="hint-link">🔗 ${item.hint}</a>
            </div>
            <span class="badge">Sample #${index + 1} / 30</span>
          </div>

          <div class="form-grid">
            <div class="form-group full-width">
              <label>Auth Methods (check all that apply)</label>
              <div class="checkbox-group">${authCheckboxes}</div>
            </div>

            <div class="form-group">
              <label>Credential Access Tier</label>
              <select onchange="updateField(${id}, 'credential_access', this.value)">
                ${CRED_OPTIONS.map(opt => `<option value="${opt}" ${saved.credential_access === opt ? 'selected' : ''}>${opt || '-- Select Access Tier --'}</option>`).join("")}
              </select>
            </div>

            <div class="form-group">
              <label>API Exists?</label>
              <select onchange="updateField(${id}, 'api_exists', this.value)">
                ${API_OPTIONS.map(opt => `<option value="${opt}" ${saved.api_exists === opt ? 'selected' : ''}>${opt || '-- Select --'}</option>`).join("")}
              </select>
            </div>

            <div class="form-group">
              <label>MCP Status</label>
              <select onchange="updateField(${id}, 'mcp_status', this.value)">
                ${MCP_OPTIONS.map(opt => `<option value="${opt}" ${saved.mcp_status === opt ? 'selected' : ''}>${opt || '-- Select MCP Status --'}</option>`).join("")}
              </select>
            </div>

            <div class="form-group">
              <label>Buildability Verdict</label>
              <select onchange="updateField(${id}, 'verdict', this.value)">
                ${VERDICT_OPTIONS.map(opt => `<option value="${opt}" ${saved.verdict === opt ? 'selected' : ''}>${opt || '-- Select Verdict --'}</option>`).join("")}
              </select>
            </div>

            <div class="form-group">
              <label>Main Blocker</label>
              <select onchange="updateField(${id}, 'main_blocker', this.value)">
                ${BLOCKER_OPTIONS.map(opt => `<option value="${opt}" ${saved.main_blocker === opt ? 'selected' : ''}>${opt || '-- Select Blocker --'}</option>`).join("")}
              </select>
            </div>

            <div class="form-group full-width">
              <label>Evidence Documentation URL</label>
              <input type="text" placeholder="https://docs.vendor.com/..." value="${saved.evidence_url || ''}" onchange="updateField(${id}, 'evidence_url', this.value)">
            </div>

            <div class="form-group full-width">
              <label>Verbatim Evidence Quote (<=300 chars)</label>
              <input type="text" maxlength="300" placeholder="Direct quote proving auth/gating..." value="${saved.evidence_quote || ''}" onchange="updateField(${id}, 'evidence_quote', this.value)">
            </div>

            <div class="form-group full-width">
              <label>Notes / Caveats</label>
              <textarea rows="2" placeholder="Optional rationale or nuances..." onchange="updateField(${id}, 'notes', this.value)">${saved.notes || ''}</textarea>
            </div>
          </div>
        `;
        container.appendChild(card);
      });

      updateProgress();
    }

    function updateField(id, field, value) {
      if (!labels[id]) labels[id] = { id, auth_methods: [] };
      labels[id][field] = value;
      save();
    }

    function updateAuth(id, method, checked) {
      if (!labels[id]) labels[id] = { id, auth_methods: [] };
      if (!labels[id].auth_methods) labels[id].auth_methods = [];
      if (checked) {
        if (!labels[id].auth_methods.includes(method)) labels[id].auth_methods.push(method);
      } else {
        labels[id].auth_methods = labels[id].auth_methods.filter(m => m !== method);
      }
      save();
    }

    function checkComplete(data) {
      return data &&
        (data.auth_methods && data.auth_methods.length > 0) &&
        data.credential_access &&
        data.api_exists &&
        data.mcp_status &&
        data.verdict &&
        data.main_blocker;
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(labels));
      sampleApps.forEach(item => {
        const id = item.id;
        const statusEl = document.getElementById(`status-${id}`);
        if (statusEl) {
          const comp = checkComplete(labels[id]);
          statusEl.className = `status-pill ${comp ? 'status-complete' : 'status-pending'}`;
          statusEl.textContent = comp ? 'Completed' : 'Pending';
        }
      });
      updateProgress();
    }

    function updateProgress() {
      const completed = sampleApps.filter(item => checkComplete(labels[item.id])).length;
      const pct = (completed / sampleApps.length) * 100;
      document.getElementById("progress").style.width = `${pct}%`;
      document.getElementById("counter").textContent = `${completed} / ${sampleApps.length} Completed`;
    }

    function exportJSON() {
      const exportData = sampleApps.map(item => {
        const val = labels[item.id] || {};
        return {
          id: item.id,
          app: item.app,
          category: item.category,
          auth_methods: val.auth_methods || ["unsure"],
          credential_access: val.credential_access || "unsure",
          api_exists: val.api_exists === "true" ? true : (val.api_exists === "false" ? false : "unsure"),
          mcp_status: val.mcp_status || "unsure",
          verdict: val.verdict || "unsure",
          main_blocker: val.main_blocker || "unsure",
          evidence_url: val.evidence_url || "",
          evidence_quote: val.evidence_quote || "",
          notes: val.notes || ""
        };
      });

      const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "gold_labels.json";
      a.click();
      URL.revokeObjectURL(url);
    }

    function exportCSV() {
      const headers = ["id", "app", "category", "auth_methods", "credential_access", "api_exists", "mcp_status", "verdict", "main_blocker", "evidence_url", "notes"];
      const rows = sampleApps.map(item => {
        const val = labels[item.id] || {};
        return [
          item.id,
          `"${item.app}"`,
          `"${item.category}"`,
          `"${(val.auth_methods || []).join(';')}"`,
          val.credential_access || "unsure",
          val.api_exists || "unsure",
          val.mcp_status || "unsure",
          val.verdict || "unsure",
          val.main_blocker || "unsure",
          `"${val.evidence_url || ''}"`,
          `"${(val.notes || '').replace(/"/g, '""')}"`
        ].join(",");
      });

      const csvContent = [headers.join(","), ...rows].join("\n");
      const blob = new Blob([csvContent], { type: "text/csv" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "gold_labels.csv";
      a.click();
      URL.revokeObjectURL(url);
    }

    window.onload = renderCards;
  </script>
</body>
</html>
